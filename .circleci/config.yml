version: 2.1

# Builds are explicitly approved and do not publish mutable tags or call SharpCD.
# Production uses locally built, dated images until deployment automation is replaced.
jobs:
  build:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run:
          name: Build security-updated image
          command: docker build --pull -t "local/security-check:${CIRCLE_SHA1}" .
      - run:
          name: Verify safe proxy reload behavior
          command: docker run --rm --network none --entrypoint python3 -v "$PWD:/work:ro" -w /work "local/security-check:${CIRCLE_SHA1}" -m unittest discover -s tests -v
workflows:
  security-build:
    jobs:
      - approve-build:
          type: approval
      - build:
          requires:
            - approve-build
