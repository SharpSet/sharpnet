version: "3"

services:
  sharpnet:
    hostname: sharpnet
    image: security-update/sharpnet:20261021
    container_name: sharpnet_corp_sharpnet_1
    restart: always

    ports:
      - "${HTTP_PORT:?err}:80"
      - "${HTTPS_PORT:?err}:443"

    environment:
      - "DEV=${DEV:?err}"
      - "MAILPASS=${MAILPASS:?err}"
      - "SENDER_EMAIL=${SENDER_EMAIL:?err}"
      - "RECEIVER_EMAIL=${RECEIVER_EMAIL:?err}"
      - "DOMAIN=${DOMAIN:?err}"

    volumes:
      - certs:/etc/letsencrypt/
      - "./config:/etc/nginx/conf.d"
      - "/var/run/docker.sock:/var/run/docker.sock"


networks:
    default:
        external:
            name: ${NETWORK:?err}

volumes:
  certs: